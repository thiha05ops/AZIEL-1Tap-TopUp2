<!-- components/header.html -->

<header class="az-header">

    <button class="az-mobile-menu-btn" type="button" aria-label="Open menu" data-i18n-aria-label="header.openMenu" aria-controls="azHeaderNav" aria-expanded="false">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>

    <!-- Logo -->
    <a href="home.html" class="az-logo" aria-label="AZIEL Home">
        <img src="/assets/logo/aziel-wordmark.webp" class="az-logo-img" alt="AZIEL">
    </a>

    <!-- Navigation -->
    <nav class="az-nav" id="azHeaderNav">
        <!-- header.js generates menu -->
    </nav>

    <!-- Right -->
    <div class="az-header-right">

        <!-- Search -->
        <button id="azHeaderSearchBtn" class="az-icon-btn az-search-trigger" type="button" aria-label="Search" data-i18n-aria-label="header.search">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>

        <!-- Cart -->
        <a href="tracking.html" id="azHeaderCartBtn" class="az-icon-btn az-cart-trigger" aria-label="Cart" data-i18n-aria-label="header.cart">
            <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
            <span id="headerCartCount" class="header-badge" style="display:none;">
                0
            </span>
        </a>

        <!-- Region / Language / Currency -->
        <button id="storefrontPreferenceBtn" class="az-preference-btn" type="button" aria-label="Region and preferences" aria-haspopup="dialog" aria-expanded="false" aria-controls="azPreferencePanel">
            <span class="az-preference-flag" data-preference-flag>🇲🇲</span>
            <span class="az-preference-summary" data-preference-summary>MM · EN · Ks</span>
        </button>

        <!-- Profile -->
        <div class="az-profile-menu">

            <button id="profileMenuBtn" class="az-profile-btn" type="button" aria-label="Account menu" data-i18n-aria-label="header.accountMenu" aria-haspopup="true" aria-expanded="false" aria-controls="profileDropdown">

                <div id="avatarText" class="az-avatar">
                    U
                </div>

            </button>

            <!-- Dropdown -->

            <div id="profileDropdown" class="az-profile-dropdown">

                <a href="account.html#profile" class="dropdown-feature">

                    <i class="fa-regular fa-user"></i>

                    <span data-i18n="nav_account">
                        Account
                    </span>

                </a>

                <a href="account.html#overview">

                    <i class="fa-solid fa-chart-line"></i>

                    <span data-i18n="overview">
                        Overview
                    </span>

                </a>

                <a href="account.html#security">

                    <i class="fa-solid fa-shield-halved"></i>

                    <span data-i18n="security">
                        Security
                    </span>

                </a>

                <a href="wallet.html">

                    <i class="fa-solid fa-wallet"></i>

                    <span data-i18n="nav_wallet">
                        Wallet
                    </span>

                </a>

                <a href="tracking.html">

                    <i class="fa-solid fa-box"></i>

                    <span data-i18n="nav_orders">
                        Orders
                    </span>

                </a>

                <a href="tracking.html#history">

                    <i class="fa-solid fa-clock-rotate-left"></i>

                    <span data-i18n="transactions">
                        Transactions
                    </span>

                </a>

                <a href="support.html" class="support-row">

                    <span class="left">

                        <i class="fa-solid fa-headset"></i>

                        <span data-i18n="nav_support">
                            Support
                        </span>

                    </span>

                    <span class="live-badge">
                        LIVE
                    </span>

                </a>

                <div class="dropdown-divider"></div>

                <button id="themeToggleBtn" class="dropdown-btn">

                    <i class="fa-regular fa-moon"></i>

                    <span data-i18n="theme">
                        Theme
                    </span>

                </button>

                <button id="mobileRefreshBtn" class="dropdown-btn az-mobile-refresh-action">

                    <i class="fa-solid fa-rotate-right"></i>

                    <span data-i18n="pwa_refresh">
                        Refresh
                    </span>

                </button>

                <button id="logoutBtn" class="dropdown-btn logout-btn">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    <span data-i18n="nav_logout">
                        Logout
                    </span>

                </button>

            </div>

        </div>

    </div>

</header>
