<!-- components/header.html -->

<header class="az-header">

    <!-- Logo -->
    <a href="home.html" class="az-logo" aria-label="AZIEL Home">
        <img src="assets/logo/aziel-wordmark.webp" class="az-logo-img" alt="AZIEL">
    </a>

    <!-- Navigation -->
    <nav class="az-nav" id="azHeaderNav">
        <!-- header.js generates menu -->
    </nav>

    <!-- Right -->
    <div class="az-header-right">

        <!-- Wallet -->
        <a href="wallet.html" class="az-wallet-pill">
            <span id="headerWalletText">0 Ks</span>
            <i class="fa-solid fa-plus"></i>
        </a>

        <!-- Notification -->
        <a href="notifications.html" class="az-icon-btn" aria-label="Notifications">

            <i class="fa-regular fa-bell"></i>

            <span id="headerNotificationCount" class="header-badge" style="display:none;">
                0
            </span>

        </a>

        <!-- Language -->
        <button id="localeOpenBtn" class="az-locale-btn" type="button">

            <span id="localeFlag">🇲🇲</span>

        </button>

        <!-- Profile -->
        <div class="az-profile-menu">

            <button id="profileMenuBtn" class="az-profile-btn" type="button">

                <div id="avatarText" class="az-avatar">
                    U
                </div>

            </button>

            <!-- Dropdown -->

            <div id="profileDropdown" class="az-profile-dropdown">

                <a href="account.html#profile" class="dropdown-feature">

                    <i class="fa-regular fa-user"></i>

                    <span data-i18n="nav_account">
                        Account
                    </span>

                </a>

                <a href="account.html#overview">

                    <i class="fa-solid fa-chart-line"></i>

                    <span data-i18n="overview">
                        Overview
                    </span>

                </a>

                <a href="account.html#security">

                    <i class="fa-solid fa-shield-halved"></i>

                    <span data-i18n="security">
                        Security
                    </span>

                </a>

                <a href="wallet.html">

                    <i class="fa-solid fa-wallet"></i>

                    <span data-i18n="nav_wallet">
                        Wallet
                    </span>

                </a>

                <a href="tracking.html">

                    <i class="fa-solid fa-box"></i>

                    <span data-i18n="nav_orders">
                        Orders
                    </span>

                </a>

                <a href="tracking.html#history">

                    <i class="fa-solid fa-clock-rotate-left"></i>

                    <span data-i18n="transactions">
                        Transactions
                    </span>

                </a>

                <a href="support.html" class="support-row">

                    <span class="left">

                        <i class="fa-solid fa-headset"></i>

                        <span data-i18n="nav_support">
                            Support
                        </span>

                    </span>

                    <span class="live-badge">
                        LIVE
                    </span>

                </a>

                <div class="dropdown-divider"></div>

                <button id="themeToggleBtn" class="dropdown-btn">

                    <i class="fa-regular fa-moon"></i>

                    <span data-i18n="theme">
                        Theme
                    </span>

                </button>

                <button id="logoutBtn" class="dropdown-btn logout-btn">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    <span data-i18n="nav_logout">
                        Logout
                    </span>

                </button>

            </div>

        </div>

    </div>

</header>
