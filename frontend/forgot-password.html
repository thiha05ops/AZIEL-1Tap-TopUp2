<!-- frontend/forgot-password.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AZIEL">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#070716">

    <title data-i18n="Forgot Password - AZIEL 1Tap">Forgot Password - AZIEL 1Tap</title>

    <link rel="stylesheet" href="css/core/main.css">
    <link rel="stylesheet" href="css/theme/aziel-design-system.css?v=20260829-p4">
    <link rel="stylesheet" href="css/theme/aziel-header.css?v=20260829-p4">
    <link rel="stylesheet" href="css/auth/auth.css?v=20260829-p4">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/brand/favicon-48.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/apple-touch-icon.png">
</head>

<body class="auth-page">

    <main class="auth-shell">

        <section class="auth-brand-panel">
            <a href="home.html" class="auth-logo"><img src="/assets/brand/aziel-logo-light.svg" alt="AZIEL"></a>

            <div class="auth-brand-content">
                <span class="auth-pill" data-i18n="forgot.password.accountRecovery">Account Recovery</span>
                <h1 data-i18n="forgot.password.forgotPassword">Forgot password?</h1>
                <p data-i18n="forgot.password.enterYourGmailAddressWellSendA6Digit">Enter your Gmail address. We’ll send
                    a 6-digit OTP to reset your password securely.</p>
            </div>
        </section>

        <section class="auth-card">
            <a href="home.html" class="auth-mobile-logo"><img src="/assets/brand/aziel-logo-dark.svg" alt="AZIEL"></a>

            <div class="auth-card-head">
                <div>
                    <h2 data-i18n="forgot.password.resetPassword">Reset password</h2>
                    <p data-i18n="forgot.password.useTheGmailLinkedToYourAccount">Use the Gmail linked to your account
                    </p>
                </div>
                <a href="login.html" data-i18n="forgot.password.signIn">Sign in</a>
            </div>

            <div id="msg" class="auth-message"></div>

            <form id="forgotForm">

                <label class="auth-label" data-i18n="forgot.password.gmailAddress">Gmail address</label>
                <div class="auth-input">
                    <i class="fa-regular fa-envelope auth-icon"></i>
                    <input id="email" type="email" placeholder="example@gmail.com" autocomplete="email" required>
                </div>

                <button type="submit" id="sendOtpBtn" class="auth-main-btn" data-i18n="forgot.password.sendOTP">
                    Send OTP
                </button>

                <p class="auth-bottom-text">
                    Remember your password?
                    <a href="login.html" data-i18n="forgot.password.signIn">Sign in</a>
                </p>

            </form>

        </section>

    </main>

    <script src="/js/locale-loader.js?v=20260829-p4"></script>
    <script src="/js/i18n.js?v=20260829-p4"></script>
    <script src="js/forgot-password.js"></script>
    <script src="js/pwa-fix.js?v=20260829-p4"></script>
    <script src="js/theme.js?v=20260829-p4"></script>
</body>

</html>
