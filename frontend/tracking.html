<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Order Tracking - AZIEL</title>

    <link rel="stylesheet" href="css/tracking.css" />
</head>

<body>
    <main class="tracking-page">

        <section class="tracking-hero">
            <div class="brand-pill">AZIEL 1Tap Shop</div>
            <h1>Track Your Order</h1>
            <p>Enter your Order ID and check your top-up status in real time.</p>
        </section>

        <section class="tracking-search-card">
            <input id="orderIdInput" placeholder="Enter Order ID e.g. AZL-123456" />
            <button id="trackBtn">Check Tracking</button>
        </section>

        <section id="trackingResult"></section>

    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/tracking.js?v=6"></script>
</body>

</html>
