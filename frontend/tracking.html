<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order - AZIEL</title>
    <link rel="stylesheet" href="css/tracking.css">
</head>

<body>

    <div class="tracking-wrapper">

        <div class="tracking-header">
            <h2>Order Tracking</h2>
            <p id="trackingOrderId">
                Order ID: -
            </p>
        </div>

        <div class="tracking-timeline">

            <div class="tracking-step active" id="stepPending">
                <div class="tracking-circle"></div>
                <span>Pending</span>
            </div>

            <div class="tracking-line"></div>

            <div class="tracking-step" id="stepPaid">
                <div class="tracking-circle"></div>
                <span>Paid</span>
            </div>

            <div class="tracking-line"></div>

            <div class="tracking-step" id="stepProcessing">
                <div class="tracking-circle"></div>
                <span>Processing</span>
            </div>

            <div class="tracking-line"></div>

            <div class="tracking-step" id="stepCompleted">
                <div class="tracking-circle"></div>
                <span>Completed</span>
            </div>

        </div>

        <div class="tracking-status-card">

            <h3 id="trackingStatusText">
                Waiting for payment...
            </h3>

            <p id="trackingGame">
                -
            </p>

            <p id="trackingPackage">
                -
            </p>

        </div>

    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/api.js"></script>
    <script src="js/tracking.js"></script>
</body>

</html>
