<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Order Tracking - AZIEL</title>

    <link rel="stylesheet" href="/css/core/main.css">
    <link rel="stylesheet" href="/css/core/components.css">
    <link rel="stylesheet" href="/css/theme/aziel-design-system.css?v=20260701">
    <link rel="stylesheet" href="/css/theme/aziel-header.css?v=20260701">
    <link rel="stylesheet" href="/css/theme/aziel-theme.css?v=20260701">
    <link rel="stylesheet" href="/css/tracking/tracking.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="manifest" href="/manifest.json">

    <meta name="theme-color" content="#070716">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="AZIEL">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
</head>

<body>

    <div id="azHeaderMount" data-nav="account"></div>

    <main class="tracking-page">

        <section class="tracking-hero">
            <span class="brand-pill">AZIEL 1Tap Shop</span>

            <h1 data-i18n="trackingTitle">
                Track Your Order
            </h1>

            <p data-i18n="trackingSubtitle">
                Enter your Order ID and check your top-up status in real time.
            </p>
        </section>

        <section class="tracking-search-card">
            <div class="tracking-input-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>

                <input id="orderIdInput" placeholder="Enter Order ID e.g. AZL-123456"
                    data-i18n-placeholder="trackingInputPlaceholder">
            </div>

            <button id="trackBtn" data-i18n="trackingCheck">
                Check Tracking
            </button>
        </section>

        <section class="recent-track-card">
            <div class="recent-track-head">
                <h2 data-i18n="trackingRecentOrders">
                    Recent Orders
                </h2>

                <span data-i18n="trackingTapToTrack">
                    Tap to track
                </span>
            </div>

            <div id="recentTrackOrders" data-i18n="loading">
                Loading...
            </div>
        </section>

        <section id="trackingResult" class="tracking-result"></section>

    </main>

    <div id="refundRequestModal" class="refund-modal">
        <div class="refund-modal-box">

            <button id="closeRefundModal" class="refund-modal-close" type="button">
                ×
            </button>

            <div class="refund-modal-icon">
                💸
            </div>

            <h2 data-i18n="refundRequestTitle">
                Request Refund
            </h2>

            <p data-i18n="refundRequestDesc">
                Tell us why you want a refund. Admin will review your request.
            </p>

            <div class="refund-order-box">
                <small data-i18n="orderId">Order ID</small>
                <strong id="refundModalOrderId">-</strong>
            </div>

            <label class="refund-label" data-i18n="refundReason">
                Refund Reason
            </label>

            <textarea id="refundReasonInput" placeholder="Example: Order failed / item not received / wrong top-up..."
                data-i18n-placeholder="refundReasonPlaceholder"></textarea>

            <div id="refundRequestMsg"></div>

            <button id="submitRefundRequestBtn" type="button" data-i18n="refundSubmit">
                Submit Refund Request
            </button>

        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script src="/js/site-settings.js"></script>

    <script src="/lang/en.js?v=20260706-i18n"></script>
    <script src="/lang/th.js?v=20260706-i18n"></script>
    <script src="/lang/my.js?v=20260706-i18n"></script>
    <script src="/js/i18n.js?v=20260706-i18n"></script>

    <script src="/js/api.js"></script>
    <script src="/js/user-state.js"></script>
    <script src="/js/campaign-runtime.js?v=20260715-phase9"></script>

    <script src="/js/header-loader.js?v=20260717-pass3"></script>
    <script src="/js/header.js?v=20260706-i18n"></script>
    <script src="/js/header-scroll.js?v=20260706"></script>

    <script src="/js/theme.js?v=20260701"></script>
    <script src="/js/locale-switcher.js?v=20260706-i18n"></script>

    <script src="/js/motion.js?v=20260712-m7"></script>
    <script src="/js/ui-feedback.js?v=20260712-m6"></script>
    <script src="/js/payment-display.js?v=20260718-payment-labels"></script>
    <script src="/js/tracking.js?v=20260718-payment-labels"></script>
    <script src="/js/pwa-fix.js"></script>

</body>

</html>
