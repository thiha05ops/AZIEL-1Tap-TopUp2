<!-- frontend/login.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Login - AZIEL 1Tap</title>

    <link rel="stylesheet" href="css/core/main.css">
    <link rel="stylesheet" href="css/theme/aziel-header.css?v=20260701">
    <link rel="stylesheet" href="css/theme/aziel-design-system.css?v=20260701">
    <link rel="stylesheet" href="css/auth/auth.css?v=20260717-pass3">
    <link rel="stylesheet" href="css/auth/login.css">

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#7c3aed">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="AZIEL">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="auth-page">

    <main class="auth-shell">

        <section class="auth-brand-panel">
            <a href="home.html" class="auth-logo">AZIEL</a>


            <div class="auth-brand-content">
                <span class="auth-pill">1Tap Game Top Up</span>
                <h1>Welcome back</h1>
                <p>Sign in to continue your top up orders, wallet, notifications and support.</p>
            </div>
        </section>

        <section class="auth-card">

            <div class="auth-card-head">
                <div>
                    <h2>Sign in</h2>
                    <p>Use your username or email</p>
                </div>
                <a href="register.html">Create</a>
            </div>

            <div id="msg" class="auth-message"></div>

            <form id="loginForm" autocomplete="off">

                <label class="auth-label">Username or Email</label>
                <div class="auth-input">
                    <i class="fa-regular fa-user auth-icon"></i>
                    <input id="username" type="text" placeholder="Enter username or email" autocomplete="username"
                        required>
                </div>

                <label class="auth-label">Password</label>
                <div class="auth-input">
                    <i class="fa-solid fa-lock auth-icon"></i>
                    <input id="password" type="password" placeholder="Enter password" autocomplete="current-password"
                        required>
                    <button type="button" id="togglePassword" class="password-eye">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>


                <div class="auth-row">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>

                    <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" id="loginBtn" class="auth-main-btn">
                    Sign In
                </button>

                <div class="auth-divider">
                    <span>or</span>
                </div>

                <a href="/api/auth/google" id="googleLoginBtn" class="google-btn">
                    <img src="assets/google.svg" alt="Google" class="google-icon">
                    <span class="google-text">Continue with Google</span>
                </a>

                <p class="auth-bottom-text">
                    Don’t have an account?
                    <a href="register.html">Create account</a>
                </p>

            </form>

        </section>

    </main>

    <script src="js/motion.js?v=20260712-m7"></script>
    <script src="js/ui-feedback.js?v=20260712-m6"></script>
    <script src="js/login.js"></script>
    <script src="js/theme.js?v=20260701"></script>
    <script src="js/pwa-fix.js"></script>
</body>

</html>
