<!-- frontend/login.html -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - AZIEL 1Tap</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="manifest" href="/manifest.json">

    <meta name="theme-color" content="#070716">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="AZIEL">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

</head>

<body class="auth-page">

    <div class="auth-wrapper">

        <div class="auth-logo">AZIEL</div>

        <form id="loginForm" class="auth-box seagm-style">

            <div class="auth-top">
                <h1>SIGN IN</h1>
                <a href="register.html" class="signup-btn">Sign up</a>
            </div>

            <div id="msg"></div>

            <div class="input-group">
                <span>👤</span>
                <input type="text" id="username" placeholder="Username" autocomplete="off" required>
            </div>

            <div class="input-group">
                <span>🔒</span>
                <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
            </div>

            <button type="submit" id="loginBtn" class="main-login-btn">
                SIGN IN
            </button>

            <p class="social-title">
                Don't have account?
                <a href="register.html">Create account</a>
            </p>

        </form>

    </div>

</body>
<script src="js/login.js"></script>

</html>
