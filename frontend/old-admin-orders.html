<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin Orders - AZIEL</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="css/theme/aziel-design-system.css?v=20260701">
    <link rel="stylesheet" href="css/theme/aziel-header.css?v=20260701">
    <link rel="stylesheet" href="/css/core/motion.css?v=20260712-m7">
    <link rel="stylesheet" href="/css/core/ui-feedback.css?v=20260712-m6">

    <meta name="theme-color" content="#070716">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="AZIEL">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>

    <div class="admin-wrap">

        <aside class="admin-sidebar">
            <h2>AZIEL Admin</h2>
            <a href="admin.html">🏠 Dashboard</a>
            <a href="admin-wallet.html">💰 Wallet Topups</a>
            <a href="home.html">↩ Back Home</a>
        </aside>

        <main class="admin-main">
            <section id="adminContent"></section>

            <div class="admin-top">
                <div>
                    <h1>Orders Dashboard</h1>
                    <p>Manage customer orders, payment slips and status.</p>
                </div>

                <button id="refreshBtn">Refresh</button>
            </div>

            <div class="admin-stats">
                <div><span>Total Orders</span><b id="totalOrders">0</b></div>
                <div><span>Paid</span><b id="paidOrders">0</b></div>
                <div><span>Processing</span><b id="processingOrders">0</b></div>
                <div><span>Completed</span><b id="completedOrders">0</b></div>
            </div>

            <div class="admin-tools">
                <input type="text" id="searchOrder" placeholder="Search order / user / game">
                <select id="statusFilter">
                    <option value="all">All Status</option>
                    <option value="pending_payment">Pending Payment</option>
                    <option value="paid">Paid</option>
                    <option value="processing">Processing</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                    <option value="failed">Failed</option>
                </select>
            </div>

            <div class="orders-table-wrap">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>Order</th>
                            <th>User</th>
                            <th>Game</th>
                            <th>Package</th>
                            <th>Amount</th>
                            <th>Payment</th>
                            <th>Status</th>
                            <th>Slip</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ordersList"></tbody>
                </table>
            </div>

            </section>

        </main>

    </div>
    <div id="slipModal" class="slip-modal">
        <span id="closeSlipModal">&times;</span>

        <img id="slipModalImg" class="slip-modal-img">

    </div>
    <script src="js/theme.js?v=20260701"></script>
    <script src="js/motion.js?v=20260712-m7"></script>
    <script src="js/ui-feedback.js?v=20260712-m6"></script>
    <script src="js/admin-api.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/socket-client.js?v=20260712"></script>
    <script src="js/payment-display.js?v=20260718-labels"></script>
    <script src="js/admin.js"></script>
    <script src="js/admin-live.js?v=4"></script>
    <script src="js/pwa-fix.js"></script>
</body>

</html>
