<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Legends - AZIEL</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="css/payment-grid.css">
</head>

<body>

    <header class="game-header">
        <a href="home.html" class="brand">AZIEL</a>
        <a href="account.html" class="account-btn">👤 Account</a>
    </header>

    <main class="game-page">

        <section class="game-hero">
            <div class="game-banner">
                <img src="assets/mlbb.jpg" alt="Mobile Legends">
                <div class="banner-overlay">
                    <h1>Mobile Legends</h1>
                    <p>Fast & secure diamond top up</p>
                </div>
            </div>

            <div class="game-info">
                <h2>How to Top Up</h2>
                <p>1. Enter your User ID and Server ID.</p>
                <p>2. Select diamond package.</p>
                <p>3. Choose payment method.</p>
                <p>4. Pay and upload slip.</p>
            </div>
        </section>

        <section class="order-panel">

            <div class="form-card">
                <h2>Account Information</h2>

                <label>User ID</label>
                <input type="text" id="userId" placeholder="Enter User ID">

                <label>Server ID</label>
                <input type="text" id="serverId" placeholder="Enter Server ID">
            </div>

            <div class="form-card">
                <h2>Select Package</h2>
                <div class="packages" id="packages" data-game="mlbb"></div>
            </div>

            <div class="form-card">
                <h2>Select Payment</h2>

                <div id="paymentGrid" class="payment-grid"></div>

                <input type="hidden" id="paymentMethod">
            </div>

            <div class="selected-box">
                <p id="selectedText">No package selected</p>
                <button id="buyBtn" disabled>Buy Now</button>
            </div>

        </section>

    </main>

    <script src="js/auth-check.js"></script>
    <script src="js/prices.js"></script>
    <script src="js/region-payment.js"></script>
    <script src="js/payment-redirect.js"></script>
    <script src="js/payment.js"></script>
    <script src="js/mlbb.js"></script>

</body>

</html>
