<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AZIEL</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">

    <div class="auth-wrapper">

        <div class="auth-logo">AZIEL</div>

        <form id="registerForm" class="auth-box seagm-style">

            <div class="auth-top">
                <h1>SIGN UP</h1>
                <a href="login.html" class="signup-btn">Sign in</a>
            </div>

            <div id="msg"></div>

            <div class="input-group">
                <span>👤</span>
                <input type="text" id="username" placeholder="Username" autocomplete="off" required>
            </div>

            <div class="input-group">
                <span>✉️</span>
                <input type="email" id="email" placeholder="Email address" autocomplete="off">
            </div>

            <div class="input-group">
                <span>🔒</span>
                <input type="password" id="password" placeholder="Password" autocomplete="new-password" required>
            </div>

            <div class="input-group">
                <span>🔒</span>
                <input type="password" id="confirmPassword" placeholder="Confirm Password" autocomplete="new-password"
                    required>
            </div>

            <button type="submit" id="registerBtn" class="main-login-btn">CREATE ACCOUNT</button>

            <p class="social-title">
                Already have account? <a href="login.html">Sign in</a>
            </p>

        </form>

    </div>

    <script src="js/register.js"></script>
</body>

</html>
