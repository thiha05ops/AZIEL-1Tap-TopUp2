<!-- frontend/register.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AZIEL">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#070716">

    <title data-i18n="Register - AZIEL 1Tap">Register - AZIEL 1Tap</title>

    <link rel="stylesheet" href="css/core/main.css">
    <link rel="stylesheet" href="css/theme/aziel-design-system.css?v=20260829-p4">
    <link rel="stylesheet" href="css/theme/aziel-header.css?v=20260829-p4">
    <link rel="stylesheet" href="css/auth/auth.css?v=20260829-p4">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/brand/favicon-48.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/apple-touch-icon.png">
</head>

<body class="auth-page">

    <main class="auth-shell">

        <section class="auth-brand-panel">
            <a href="home.html" class="auth-logo"><img src="/assets/brand/aziel-logo-light.svg" alt="AZIEL"></a>

            <div class="auth-brand-content">
                <span class="auth-pill" data-i18n="register.createYourAccount">Create your account</span>
                <h1 data-i18n="register.joinAZIEL">Join AZIEL</h1>
                <p data-i18n="register.createYourAccountToManageOrdersWalletNotificationsAnd">Create your account to manage orders, wallet, notifications and support easily.</p>
            </div>
        </section>

        <section class="auth-card">
            <a href="home.html" class="auth-mobile-logo"><img src="/assets/brand/aziel-logo-dark.svg" alt="AZIEL"></a>

            <div class="auth-card-head">
                <div>
                    <h2 data-i18n="register.signUp">Sign up</h2>
                    <p data-i18n="register.emailIsRequiredForAccountRecovery">Email is required for account recovery</p>
                </div>
                <a href="login.html" data-i18n="register.signIn">Sign in</a>
            </div>

            <div id="msg" class="auth-message"></div>

            <form id="registerForm">

                <label class="auth-label" data-i18n="register.username">Username</label>
                <div class="auth-input">
                    <i class="fa-regular fa-user auth-icon"></i>
                    <input id="username" type="text" placeholder="Choose username" data-i18n-placeholder="auth.register.usernamePlaceholder" autocomplete="username" required>
                </div>

                <label class="auth-label" data-i18n="register.emailAddress">Email address</label>
                <div class="auth-input">
                    <i class="fa-regular fa-envelope auth-icon"></i>
                    <input id="email" type="email" placeholder="Enter Gmail address" data-i18n-placeholder="auth.emailPlaceholder" autocomplete="email" required>
                </div>

                <label class="auth-label" data-i18n="register.password">Password</label>
                <div class="auth-input">
                    <i class="fa-solid fa-lock auth-icon"></i>
                    <input id="password" type="password" placeholder="Create password" data-i18n-placeholder="auth.register.passwordPlaceholder" autocomplete="new-password"
                        minlength="8"
                        required>
                    <button type="button" id="togglePassword" class="password-eye">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>

                <label class="auth-label" data-i18n="register.confirmPassword">Confirm Password</label>
                <div class="auth-input">
                    <i class="fa-solid fa-shield-halved auth-icon"></i>
                    <input id="confirmPassword" type="password" placeholder="Confirm password" data-i18n-placeholder="auth.confirmPasswordPlaceholder"
                        autocomplete="new-password" minlength="8" required>
                </div>

                <button type="submit" id="registerBtn" class="auth-main-btn" data-i18n="register.createAccount">
                    Create Account
                </button>

                <div class="auth-divider">
                    <span data-i18n="register.or">or</span>
                </div>

                <a href="/api/auth/google" class="google-btn">
                    <img src="assets/google.svg" alt="Google" class="google-icon">
                    <span class="google-text" data-i18n="register.continueWithGoogle">Continue with Google</span>
                </a>

                <p class="auth-bottom-text">
                    Already have an account?
                    <a href="login.html" data-i18n="register.signIn">Sign in</a>
                </p>

            </form>

        </section>

    </main>

    <script src="/js/locale-loader.js?v=20260829-p4"></script>
    <script src="/js/i18n.js?v=20260829-p4"></script>
    <script src="js/motion.js?v=20260829-p4"></script>
    <script src="js/ui-feedback.js?v=20260829-p4"></script>
    <script src="js/register.js"></script>
    <script src="js/pwa-fix.js?v=20260829-p4"></script>
</body>

</html>
