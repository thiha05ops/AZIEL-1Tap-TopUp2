<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#070716">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="AZIEL">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Google Login</title>
</head>

<body>
    <script>
        const params = new URLSearchParams(window.location.search);

        const token = params.get("token");
        const username = params.get("username") || "";
        const displayName = params.get("displayName") || username || "User";
        const email = params.get("email") || "";
        const region = params.get("region") || "MM";
        const role = params.get("role") || "user";

        if (!token) {
            window.location.href = "login.html";
        } else {
            const user = {
                username,
                displayName,
                email,
                region,
                role
            };

            localStorage.setItem("token", token);
            localStorage.setItem("azielToken", token);
            localStorage.setItem("isLogin", "true");

            localStorage.setItem("username", username);
            localStorage.setItem("displayName", displayName);
            localStorage.setItem("email", email);
            localStorage.setItem("region", region);
            localStorage.setItem("role", role);

            localStorage.setItem("user", JSON.stringify(user));
            localStorage.setItem("azielUser", JSON.stringify(user));

            window.location.replace("home.html");
        }
    </script>
</body>

</html>
