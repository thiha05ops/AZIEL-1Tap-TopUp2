<!-- frontend/reset-password.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AZIEL">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#070716">

    <title>Reset Password - AZIEL 1Tap</title>

    <link rel="stylesheet" href="css/core/main.css">
    <link rel="stylesheet" href="css/theme/aziel-design-system.css?v=20260701">
    <link rel="stylesheet" href="css/theme/aziel-header.css?v=20260701">
    <link rel="stylesheet" href="css/core/layout.css">
    <link rel="stylesheet" href="css/core/components.css">
    <link rel="stylesheet" href="css/auth/auth.css?v=20260717-pass3">
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="auth-page">

    <main class="auth-shell">

        <section class="auth-brand-panel">
            <a href="home.html" class="auth-logo">AZIEL</a>

            <div class="auth-brand-content">
                <span class="auth-pill">Password Reset</span>
                <h1>New password</h1>
                <p>Create a strong new password for your AZIEL account.</p>
            </div>
        </section>

        <section class="auth-card">

            <div class="auth-card-head">
                <div>
                    <h2>Reset Password</h2>
                    <p id="usernameInfo" class="username-info"></p>
                    <p>Minimum 6 characters required</p>
                </div>
                <a href="login.html">Sign in</a>
            </div>

            <div id="msg" class="auth-message"></div>

            <form id="resetPasswordForm">

                <label class="auth-label">New Password</label>
                <div class="auth-input">
                    <i class="fa-solid fa-lock auth-icon"></i>
                    <input id="newPassword" type="password" placeholder="Enter new password" autocomplete="new-password"
                        minlength="8"
                        required>
                    <button type="button" id="togglePassword" class="password-eye">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>

                <label class="auth-label">Confirm Password</label>
                <div class="auth-input">
                    <i class="fa-solid fa-shield-halved auth-icon"></i>
                    <input id="confirmPassword" type="password" placeholder="Confirm new password"
                        autocomplete="new-password" minlength="8" required>
                </div>

                <button type="submit" id="resetPasswordBtn" class="auth-main-btn">
                    Update Password
                </button>

                <p class="auth-bottom-text">
                    Back to
                    <a href="login.html">Sign in</a>
                </p>

            </form>

        </section>

    </main>

    <script src="js/reset-password.js"></script>
    <script src="js/pwa-fix.js"></script>
    <script src="js/theme.js?v=20260701"></script>
</body>

</html>
