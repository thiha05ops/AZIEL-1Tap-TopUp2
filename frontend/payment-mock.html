<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - AZIEL</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/page.css">
    <link rel="stylesheet" href="css/payment-page.css">
</head>

<body>

    <div class="payment-wrap">

        <div class="payment-card">

            <a href="home.html" class="back-btn">← Back Home</a>

            <h1>Complete Payment</h1>
            <p class="sub-text">Please pay the exact amount and upload your payment screenshot.</p>

            <div class="order-info">
                <p><b>Order ID:</b> <span id="orderIdText">-</span></p>
                <p><b>Game:</b> <span id="gameText">-</span></p>
                <p><b>Package:</b> <span id="packageText">-</span></p>
                <p><b>User ID:</b> <span id="userIdText">-</span></p>
                <p><b>Server:</b> <span id="zoneIdText">-</span></p>
                <p><b>Amount:</b> <span id="amountText">-</span></p>
            </div>

            <div class="qr-section">
                <img id="qrImage" src="" alt="Payment QR">
                <h3 id="paymentName">Payment</h3>
                <p>Scan QR or pay with selected payment app.</p>
            </div>

            <label class="upload-box">
                <span>📤 Upload Payment Screenshot</span>
                <input type="file" id="paymentSlip" accept="image/*">
            </label>

            <button id="submitPaymentBtn">Submit Payment</button>

            <div id="paymentMsg"></div>

            <div id="afterPaymentActions" class="after-actions" style="display:none;">
                <button id="backGameBtn">Back to Game</button>
                <button id="viewHistoryBtn">View History</button>
            </div>

        </div>

    </div>

    <script src="js/payment-page.js"></script>
</body>

</html>
