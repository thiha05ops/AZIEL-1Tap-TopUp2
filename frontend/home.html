<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZIEL 1Tap TopUp</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/home.css">
</head>

<body>

    <header class="home-header">
        <div class="logo">AZIEL 1Tap</div>

        <nav class="nav-links">
            <a href="home.html">Home</a>
            <a href="shop.html">Top Up</a>
        </nav>

        <div class="header-right">

            <div class="noti-bell" id="notiBtn">
                🔔
                <span id="notiCount">0</span>
            </div>

            <div class="profile-box" id="profileBox">
                <div class="avatar" id="avatarText">👤</div>
                <span id="usernameText">Login</span>

                <div class="profile-dropdown" id="profileDropdown">
                    <a href="account.html">Account</a>
                    <a href="notifications.html">Notifications</a>
                    <button id="logoutBtn">Logout</button>
                </div>
            </div>

        </div>
    </header>

    <main id="mainHome">

        <section class="hero">
            <div class="hero-left">
                <h1>Welcome to AZIEL 1Tap Shop</h1>
                <p>Fast, secure and trusted game top-up service.</p>
                <a href="shop.html" class="hero-btn">Start Top Up</a>
            </div>

            <div class="hero-right">
                <img src="assets/hero.jpg" alt="Hero">
            </div>
        </section>

        <section class="games-section">
            <h2>Popular Games</h2>

            <div class="game-grid">
                <a href="mlbb.html" class="game-card">
                    <img src="assets/mlbb.jpg" alt="MLBB">
                    <h3>Mobile Legends</h3>
                </a>

                <a href="pubg.html" class="game-card">
                    <img src="assets/pubg.jpg" alt="PUBG">
                    <h3>PUBG Mobile</h3>
                </a>

                <a href="freefire.html" class="game-card">
                    <img src="assets/freefire.jpg" alt="Free Fire">
                    <h3>Free Fire</h3>
                </a>

                <a href="hok.html" class="game-card">
                    <img src="assets/hok.jpg" alt="HOK">
                    <h3>Honor of Kings</h3>
                </a>
            </div>
        </section>

    </main>

    <footer>
        © 2026 AZIEL 1Tap Shop
    </footer>

    <script src="js/auth-check.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/home.js"></script>

</body>

</html>
