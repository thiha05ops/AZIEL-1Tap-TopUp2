<!-- frontend/verify-email.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AZIEL">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#070716">

    <title>Verify Email - AZIEL 1Tap</title>

    <link rel="stylesheet" href="css/core/main.css">
    <link rel="stylesheet" href="css/core/components.css">
    <link rel="stylesheet" href="css/core/layout.css">
    <link rel="stylesheet" href="css/theme/aziel-design-system.css?v=20260701">
    <link rel="stylesheet" href="css/auth/auth.css?v=20260717-pass3">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="auth-page">

    <main class="auth-shell">

        <section class="auth-brand-panel">
            <a href="home.html" class="auth-logo">AZIEL</a>

            <div class="auth-brand-content">
                <span class="auth-pill">Email Verification</span>
                <h1>Verify Gmail</h1>
                <p>Enter the 6-digit OTP sent to your Gmail to activate your AZIEL account.</p>
            </div>
        </section>

        <section class="auth-card">

            <div class="auth-card-head">
                <div>
                    <h2>Verify Email</h2>
                    <p id="verifyEmailText">Check your Gmail inbox</p>
                </div>
                <a href="register.html">Back</a>
            </div>

            <div id="msg" class="auth-message"></div>

            <form id="verifyEmailForm">

                <label class="auth-label">6-digit OTP</label>
                <div class="auth-input">
                    <i class="fa-solid fa-shield-halved auth-icon"></i>
                    <input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="Enter OTP" data-i18n-placeholder="auth.otp.placeholder" required>
                </div>

                <button type="submit" id="verifyEmailBtn" class="auth-main-btn">
                    Verify & Create Account
                </button>

                <p class="auth-bottom-text">
                    Wrong email?
                    <a href="register.html">Register again</a>
                </p>

            </form>

        </section>

    </main>

    <script src="js/verify-email.js"></script>
    <script src="js/pwa-fix.js?v=20260723-context-bank-runtime"></script>
    <script src="js/theme.js?v=20260701"></script>
</body>

</html>
