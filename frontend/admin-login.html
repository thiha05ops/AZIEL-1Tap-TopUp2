<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Admin Login
    </title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="/css/aziel-design-system.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #070716;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #adminLoginForm {
            width: 92%;
            max-width: 420px;
            background: linear-gradient(135deg, #101028, #1d1d4d);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 26px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
        }

        #adminLoginForm h1 {
            color: #ffd700;
            margin-top: 0;
        }

        #adminLoginForm input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 14px;
            background: #070716;
            color: white;
            box-sizing: border-box;
        }

        #adminLoginForm button {
            width: 100%;
            padding: 15px;
            margin-top: 14px;
            border: none;
            border-radius: 14px;
            background: #ffd700;
            color: #111;
            font-weight: 900;
            cursor: pointer;
        }

        #adminMsg {
            margin-top: 14px;
            color: #ffd700;
        }
    </style>
    <link rel="manifest" href="/manifest.json">

    <meta name="theme-color" content="#070716">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="AZIEL">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>

<body>

    <form id="adminLoginForm">

        <h1>
            ADMIN LOGIN
        </h1>

        <input type="text" id="adminUsername" placeholder="Username">

        <input type="password" id="adminPassword" placeholder="Password">

        <button type="submit" id="adminLoginBth">
            LOGIN
        </button>
        <button type="button" onclick="resetAdminSession()">
            Reset Admin Session
        </button>

        <p id="adminMsg"></p>

    </form>

    <script src="js/admin-login.js"></script>
    <script src="js/admin-api.js"></script>
</body>

</html>
