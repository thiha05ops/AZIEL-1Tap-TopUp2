<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Notifications - AZIEL</title>

    <link rel="stylesheet" href="/css/core/main.css">
    <link rel="stylesheet" href="/css/core/components.css">
    <link rel="stylesheet" href="/css/theme/aziel-design-system.css">
    <link rel="stylesheet" href="/css/theme/aziel-header.css">
    <link rel="stylesheet" href="/css/notifications/notification.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<meta name="theme-color" content="#070716">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="AZIEL">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
</head>

<body>
    <div id="azHeaderMount" data-nav="account"></div>

    <main class="noti-page">
        <section class="noti-hero">
            <div>
                <span>Notification Center</span>
                <h1>Notifications</h1>
                <p>Order, payment, wallet, support and system updates in one secure inbox.</p>
            </div>

            <div class="noti-hero-actions">
                <strong id="notificationUnreadContext">0 unread notifications</strong>
                <button id="markAllReadBtn" type="button">
                    <i class="fa-solid fa-check-double"></i>
                    Mark all read
                </button>
            </div>
        </section>

        <section class="noti-toolbar">
            <div id="notificationFilters" class="noti-filters"></div>
        </section>

        <section id="notificationsList" class="notifications-list">
            Loading...
        </section>

        <div class="noti-load-more">
            <button id="loadMoreNotificationsBtn" type="button" hidden>
                Load More
            </button>
        </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/lang/en.js?v=20260723-language-authority"></script>
    <script src="/lang/th.js?v=20260723-language-authority"></script>

    <script src="/js/campaign-runtime.js?v=20260715-phase9"></script>
    <script src="/js/socket-client.js?v=20260712"></script>
    <script src="/js/payment-display.js?v=20260718-labels"></script>
    <script src="/js/notification-store.js?v=20260712-m5"></script>
    <script src="/js/motion.js?v=20260712-m7"></script>
    <script src="/js/ui-feedback.js?v=20260712-m6"></script>
    <script src="/js/header-loader.js?v=20260717-pass3"></script>
    <script src="/js/header.js?v=20260712-m5"></script>
    <script src="/js/api.js"></script>
    <script src="/js/notifications-page.js?v=20260712-m5"></script>
    <script src="/js/notification-live.js?v=20260712-m5"></script>
    <script src="/js/pwa-fix.js?v=20260723-context-bank-runtime"></script>
    <script src="/js/site-settings.js"></script>
</body>

</html>
