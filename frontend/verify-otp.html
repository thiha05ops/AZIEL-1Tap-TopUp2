<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AZIEL">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#070716">

    <title data-i18n="Verify OTP - AZIEL 1Tap">Verify OTP - AZIEL 1Tap</title>

    <link rel="stylesheet" href="css/core/main.css">
    <link rel="stylesheet" href="css/core/components.css">
    <link rel="stylesheet" href="css/core/layout.css">
    <link rel="stylesheet" href="css/theme/aziel-design-system.css?v=20260701">
    <link rel="stylesheet" href="css/theme/aziel-header.css?v=20260701">
    <link rel="stylesheet" href="css/theme/aziel-design-system.css">
    <link rel="stylesheet" href="css/theme/aziel-header.css">
    <link rel="stylesheet" href="css/theme/aziel-design-system.css">
    <link rel="stylesheet" href="css/auth/auth.css?v=20260827-brand">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/brand/favicon-48.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/apple-touch-icon.png">
</head>

<body class="auth-page">

    <main class="auth-shell">

        <section class="auth-brand-panel">
            <a href="home.html" class="auth-logo"><img src="/assets/brand/aziel-logo-light.svg" alt="AZIEL"></a>

            <div class="auth-brand-content">
                <span class="auth-pill" data-i18n="verify.otp.securityCheck">Security Check</span>
                <h1 data-i18n="verify.otp.verifyOTP">Verify OTP</h1>
                <p data-i18n="verify.otp.enterThe6DigitCodeSentToYourGmail">Enter the 6-digit code sent to your Gmail account to continue password reset.</p>
            </div>
        </section>

        <section class="auth-card">
            <a href="home.html" class="auth-mobile-logo"><img src="/assets/brand/aziel-logo-dark.svg" alt="AZIEL"></a>

            <div class="auth-card-head">
                <div>
                    <h2 data-i18n="verify.otp.enterOTP">Enter OTP</h2>
                    <p id="otpEmailText" data-i18n="verify.otp.checkYourGmailInbox">Check your Gmail inbox</p>
                </div>
                <a href="forgot-password.html" data-i18n="verify.otp.back">Back</a>
            </div>

            <div id="msg" class="auth-message"></div>

            <form id="verifyOtpForm">

                <label class="auth-label" data-i18n="verify.otp.6DigitOTP">6-digit OTP</label>
                <div class="auth-input">
                    <i class="fa-solid fa-shield-halved auth-icon"></i>
                    <input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="Enter OTP" data-i18n-placeholder="auth.otp.placeholder" required>
                </div>

                <button type="submit" id="verifyOtpBtn" class="auth-main-btn" data-i18n="verify.otp.verifyOTP">
                    Verify OTP
                </button>

                <p class="auth-bottom-text">
                    <span data-i18n="verify.otp.didntReceive">Didn’t receive code?</span>
                    <a href="forgot-password.html" data-i18n="verify.otp.sendAgain">Send again</a>
                </p>

            </form>
            <div id="usernameBox" class="username-box" style="display:none;">
                <span data-i18n="verify.otp.usernameLabel">Username:</span> <strong id="usernameText"></strong>
            </div>

        </section>

    </main>

    <script src="lang/en.js?v=20260809-g21-explicit"></script>
    <script src="lang/th.js?v=20260809-g21-explicit"></script>
    <script src="lang/my.js?v=20260809-g21-explicit"></script>
    <script src="lang/storefront-static.js?v=20260809-g21-explicit"></script>
    <script src="js/i18n.js?v=20260809-g21-explicit"></script>
    <script src="js/verify-otp.js?v=20260809-g21-explicit"></script>
    <script src="js/pwa-fix.js?v=20260723-context-bank-runtime"></script>
    <script src="js/theme.js?v=20260701"></script>
</body>

</html>
