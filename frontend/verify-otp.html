<!-- frontend/verify-otp.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Verify OTP - AZIEL 1Tap</title>

    <link rel="stylesheet" href="css/core/main.css">
    <link rel="stylesheet" href="css/core/aziel-design-system.css">
    <link rel="stylesheet" href="css/auth/auth.css">
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="auth-page">

    <main class="auth-shell">

        <section class="auth-brand-panel">
            <a href="home.html" class="auth-logo">AZIEL</a>

            <div class="auth-brand-content">
                <span class="auth-pill">Security Check</span>
                <h1>Verify OTP</h1>
                <p>Enter the 6-digit code sent to your Gmail account to continue password reset.</p>
            </div>
        </section>

        <section class="auth-card">

            <div class="auth-card-head">
                <div>
                    <h2>Enter OTP</h2>
                    <p id="otpEmailText">Check your Gmail inbox</p>
                </div>
                <a href="forgot-password.html">Back</a>
            </div>

            <div id="msg" class="auth-message"></div>

            <form id="verifyOtpForm">

                <label class="auth-label">6-digit OTP</label>
                <div class="auth-input">
                    <i class="fa-solid fa-shield-halved auth-icon"></i>
                    <input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="Enter OTP" required>
                </div>

                <button type="submit" id="verifyOtpBtn" class="auth-main-btn">
                    Verify OTP
                </button>

                <p class="auth-bottom-text">
                    Didn’t receive code?
                    <a href="forgot-password.html">Send again</a>
                </p>

            </form>
            <div id="usernameBox" class="username-box" style="display:none;">
                Username: <strong id="usernameText"></strong>
            </div>

        </section>

    </main>

    <script src="js/verify-otp.js"></script>
    <script src="js/pwa-fix.js"></script>
</body>

</html>
