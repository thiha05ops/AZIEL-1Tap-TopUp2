<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#070716">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AZIEL">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/theme/aziel-design-system.css">
    <link rel="stylesheet" href="/css/core/offline-home.css?v=20261026-pwa-offline-v1">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/apple-touch-icon.png">
    <title>Offline | AZIEL 1Tap Shop</title>
</head>
<body>
    <header class="offline-header">
        <img src="/assets/brand/aziel-logo-primary.svg" alt="AZIEL" width="132" height="42">
        <span class="offline-status" data-offline-status>Offline</span>
    </header>
    <main>
        <section class="offline-hero" aria-labelledby="offlineTitle">
            <p class="offline-eyebrow" data-offline-copy="eyebrow">AZIEL 1Tap Shop</p>
            <h1 id="offlineTitle" data-offline-copy="title">You're offline</h1>
            <p data-offline-copy="description">Your public Home is available in offline mode. Connect to refresh games, prices, and promotions.</p>
            <p class="offline-notice" role="status" aria-live="polite" data-offline-notice>Connection required for live actions.</p>
            <button type="button" data-offline-retry><span data-offline-copy="retry">Try connection</span></button>
        </section>
        <section class="offline-preview" aria-label="AZIEL storefront preview" aria-disabled="true">
            <div class="offline-card"><span aria-hidden="true">🎮</span><strong data-offline-copy="games">Games</strong></div>
            <div class="offline-card"><span aria-hidden="true">🎁</span><strong data-offline-copy="services">Digital services</strong></div>
            <div class="offline-card"><span aria-hidden="true">🏷️</span><strong data-offline-copy="offers">AZIEL offers</strong></div>
        </section>
    </main>
    <script src="/js/offline-home.js?v=20261026-pwa-offline-v1" defer></script>
</body>
</html>
