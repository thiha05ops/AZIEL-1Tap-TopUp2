<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Offline | AZIEL 1Tap Shop</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#070716">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AZIEL">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="/css/theme/aziel-design-system.css">
    <link rel="stylesheet" href="/css/core/main.css">
    <style>
        body {
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--text, #f8fafc);
            background: var(--bg, #070716);
        }

        main {
            width: min(440px, 100%);
            display: grid;
            gap: 12px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 0;
        }

        p {
            margin: 0;
            color: var(--text-secondary, #cbd5e1);
            line-height: 1.6;
        }

        a {
            width: fit-content;
            min-height: 42px;
            margin: 8px auto 0;
            padding: 0 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: rgba(139, 92, 246, .16);
            color: var(--primary, #a78bfa);
            font-weight: 900;
            text-decoration: none;
        }

        a:focus-visible {
            outline: 3px solid rgba(139, 92, 246, .72);
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <main>
        <h1>You're offline</h1>
        <p>AZIEL needs a connection for wallet, orders, notifications, and checkout. Public pages will reload when your connection returns.</p>
        <a href="/home.html">Try Home</a>
    </main>
</body>

</html>
