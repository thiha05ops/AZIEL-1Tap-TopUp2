<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#070716">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="AZIEL">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>

<body class="auth-page">
    <section class="auth-layout">
        <div class="auth-card">
            <h3>Forgot Password</h3>
            <input type="text" id="forgotUser" placeholder="Enter username or email">
            <button id="forgotBtn">Send Reset Link</button>
            <p id="forgotMsg"></p>
            <p class="auth-switch"><a href="login.html">Back to Login</a></p>
        </div>
    </section>
    <script src="forgot.js"></script>
    <script src="js/pwa-fix.js"></script>


</body>

</html>
