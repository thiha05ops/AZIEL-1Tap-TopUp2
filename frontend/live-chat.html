<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <title>Customer Support - AZIEL</title>

    <link rel="stylesheet" href="/css/support/live-chat.css" />
<link rel="stylesheet" href="/css/theme/aziel-header.css?v=20260701">
    <link rel="stylesheet" href="/css/theme/aziel-design-system.css?v=20260701">

    <meta name="theme-color" content="#070716">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="AZIEL">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>

    <div class="chat-container">

        <div class="chat-header">
            <h2>💬 Customer Support</h2>
            <p>Talk with AZIEL Admin Team</p>
        </div>

        <div id="chatMessages" class="chat-messages">
            <div class="empty-chat">
                Start chatting with support...
            </div>
        </div>

        <div class="chat-input-box">

            <input type="text" id="chatInput" placeholder="Type your message..." />

            <button id="sendChatBtn">
                Send
            </button>

        </div>

    </div>
    <script src="js/theme.js?v=20260701"></script>
    <script src="/js/live-chat.js"></script>
    <script src="/js/pwa-fix.js"></script>
    <script src="/js/site-settings.js"></script>
    <script src="/js/api.js"></script>

</body>

</html>
